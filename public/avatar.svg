  <!-- Neck -->
  <rect x="88" y="110" width="24" height="30" rx="4" fill="url(#skinGrad)" />
  <!-- Head -->
  <ellipse cx="100" cy="85" rx="35" ry="42" fill="url(#skinGrad)" />
  <!-- Hair -->
  <path d="M65 80 C63 50, 80 40, 100 40 C125 40, 137 52, 135 80 C125 65, 115 62, 100 62 C85 62, 75 70, 65 80 Z" fill="#334155" />
  <!-- Glasses -->
  <rect x="75" y="76" width="20" height="15" rx="4" fill="none" stroke="#0f172a" stroke-width="3" />
  <rect x="105" y="76" width="20" height="15" rx="4" fill="none" stroke="#0f172a" stroke-width="3" />
  <line x1="95" y1="83" x2="105" y2="83" stroke="#0f172a" stroke-width="3" />
  <!-- Smile -->
