<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>🛍️ Product Catalog</h1>
      <p class="subtitle">Explore our collection powered by Node.js, Express, and Fetch API</p>
    </header>

    <main>
      <!-- Loading Spinner -->
      <div id="loading-spinner" class="spinner-container">
        <div class="spinner"></div>
        <p>Loading products...</p>
      </div>

      <!-- Error Message -->
      <div id="error-message" class="error-container" style="display: none;">
        <p class="error-text">⚠️ Unable to load products. Please ensure the server is running and try again.</p>
      </div>

      <!-- Products Grid Container -->
      <div id="products-container" class="products-grid"></div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>Simple Express.js Product List &bull; Dynamic JSON Fetch Demo</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
